[project]
name = "roboeval"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "Yi Ru Wang", email = "yiruwang@cs.washington.edu" }]
requires-python = ">=3.11"
dependencies = [
    "roboeval-metrics @ git+https://github.com/Robo-Eval/roboeval-metrics.git",
    "gymnasium @ git+https://github.com/wpumacay/Gymnasium.git@roboeval",
    # pyquaternion doesn't support 2.x yet
    "numpy==1.26.*",
    "safetensors==0.4.3",
    # Demos were recorded under 3.1.5; replay is version-sensitive and the
    # released results were produced with 3.3.3
    "mujoco==3.3.3",
    # needed for pyMJCF
    "dm_control==1.0.31",
    "imageio",
    "pyquaternion",
    "mujoco_utils",
    "wget",
    "mojo @ git+https://github.com/helen9975/mojo.git",
    "pyyaml",
    "dearpygui",
    "pyopenxr",
    "click-prompt",
    "rich-click",
    "hydra-core==1.3.*",
    "pynput==1.7.7",
    "importlib-metadata",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest",
    "ipython",
    "ipdb",
    "pybind11-stubgen",
    "ruff",
    "ty",
]
examples = [
    "moviepy==1.0.3",
    "pygame",
    "opencv-python",
    "matplotlib",
    "pandas",
    "lerobot",
]
vr = [
    "pyopenxr",
    "dearpygui",
    "click-prompt",
    "rich-click",
    "pyyaml",
    "oculus-reader @ git+https://github.com/helen9975/oculus_reader.git",
    # ⚠️ Oculus Quest setup requires Git LFS and ADB (see docs/vr_teleop.md)
]

[tool.setuptools.packages.find]
where = ["."]
include = ["roboeval*"]

[tool.setuptools.package-data]
roboeval = ["envs/xmls/**/*", "envs/presets/**/*.yaml"]
vr = ["viewer/xmls/**/*"]

###################################################################################################
# FORMATTING AND LINTING SETUP
###################################################################################################

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # PEP8
    "W",
    # flake8-annotations
    "ANN",
]
ignore = [
    "C408",   # don't complain about usage of dict() calls
    "C901",   # don't complain about function complexity
    "E501",   # don't complain about line-length (handled by line-length setting)
    "B006",   # defaults shouldn't be mutable
    "UP015",  # redundant mode arguments in open should be fine for now
    "SIM117", # allow nested with statements for now
    "SIM102", # don't be picky about nested if statements
    "SIM114", # don't be picky about merging if branches using or
    "B905",   # allow zip() without `strict` parameter
    "B026",   # allow star-arg after keyword argument for now
    "ANN001", #	missing-type-function-argument
    "ANN201", # missing-return-type-undocumented-public-function
    "ANN202", # missing-return-type-private-function
    "ANN003", # missing-type-kwargs
    "E402",   # module-import-not-at-top-of-file
    "ANN401", # allow dynamic typed expressions
]

[tool.ruff.lint.pydocstyle]
convention = "google"
